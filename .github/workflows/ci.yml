name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the declared minimum; 26 is the current Active LTS line.
        node-version:
          - '22.12.0'
          - '26'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository-pinned npm version
        run: |
          npm install --global npm@11.6.2
          test "$(npm --version)" = "11.6.2"
          node --version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check all configured workspaces
        run: npm run typecheck

      - name: Compile all configured workspaces
        run: npm run build

      - name: Run all configured workspace tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Start implemented services and verify readiness
        run: npm run smoke:services
