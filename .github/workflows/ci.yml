name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the declared minimum; 26 is the current Active LTS line.
        node-version:
          - '22.12.0'
          - '26'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Use the repository-pinned npm version
        run: |
          npm install --global npm@11.6.2
          test "$(npm --version)" = "11.6.2"
          node --version

      - name: Install dependencies
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No committed package-lock.json exists yet. Generating a temporary lockfile for this run; commit the generated lockfile artifact to make installs reproducible across runs."
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci --no-audit --no-fund
          fi

      - name: Type-check all configured workspaces
        run: npm run typecheck

      - name: Compile all configured workspaces
        run: npm run build

      - name: Run all configured workspace tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Start services and verify readiness
        run: npm run smoke:services

      - name: Upload generated lockfile for repository bootstrap
        if: always() && matrix.node-version == '26' && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-lockfile-bootstrap
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
