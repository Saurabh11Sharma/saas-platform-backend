name: Format README on containerization branch

on:
  push:
    branches:
      - infra/containerize-current-services

permissions:
  contents: write

concurrency:
  group: format-containerization-readme
  cancel-in-progress: false

jobs:
  format-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Install repository-pinned npm
        run: |
          npm install --global npm@11.6.2
          test "$(npm --version)" = "11.6.2"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format README with the repository Prettier configuration
        run: npx prettier --write README.md

      - name: Commit formatting on this feature branch only
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "style: format containerization README changes"
          git push origin HEAD:infra/containerize-current-services
